<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff1f6"><title>Calibração • Quem brinca muito vira?</title><style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#452c40;background:#fff6fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#ffe0ed,transparent 40%),#fff7fb;min-height:100vh}.wrap{max-width:750px;margin:auto;padding:24px 17px 80px}.top{display:flex;justify-content:space-between;align-items:center;color:#966780;font-size:13px;margin-bottom:20px}.pill{border:1px solid #e9bbd1;border-radius:30px;padding:8px 13px}.card{background:white;box-shadow:0 15px 50px #bd759027;border:1px solid #f5dbe7;border-radius:27px;padding:clamp(22px,5vw,42px)}h1{font-size:clamp(30px,6vw,49px);line-height:1.12;margin:12px 0;color:#753d61}h2{font-size:clamp(22px,4.5vw,31px);line-height:1.3;margin:16px 0 21px}.sub{line-height:1.65;color:#765b6b}.eyebrow{letter-spacing:2px;font-weight:750;color:#bf638e;font-size:11px}.btn{border:0;border-radius:13px;background:#a63c76;color:white;font:inherit;font-weight:700;padding:15px 23px;cursor:pointer;min-height:48px}.btn.secondary{background:#fff0f6;color:#814766}.btn:disabled{opacity:.35;cursor:not-allowed}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:25px}.option{display:block;width:100%;text-align:left;border:1.5px solid #eddae5;background:white;padding:14px 16px;border-radius:15px;font:inherit;color:#513a4b;margin:10px 0;line-height:1.4;cursor:pointer}.option.selected{background:#ffeaf3;border-color:#ae457f;box-shadow:0 0 0 1px #ae457f}.option:disabled{opacity:.5}.letter{display:inline-flex;width:28px;height:28px;justify-content:center;align-items:center;border-radius:9px;background:#f7e9f0;margin-right:10px;font-size:12px;font-weight:800}.bar{height:7px;background:#f6e2ec;overflow:hidden;border-radius:10px;margin:16px 0 24px}.bar>div{height:100%;background:#c05b90;transition:width .15s}.hint{color:#86677b;font-size:13px;margin:15px 0}.select{width:100%;padding:15px;border-radius:14px;background:white;border:1px solid #dfb8ce;font-size:16px;color:#533349}.small{font-size:13px;color:#826579;line-height:1.6}.note{padding:16px;background:#fff2f8;border-radius:14px;margin:18px 0;color:#755467;line-height:1.55}button:focus-visible,select:focus-visible{outline:3px solid #cc8bae;outline-offset:2px} .hide{display:none} .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ca6b9a;margin-right:4px}
</style></head><body><main class="wrap"><div class="top"><b>✳ arquivos da fofoca</b><span class="pill">edição calibração 💌</span></div><div id="app" class="card"><h1>Calibração das personagens</h1><p>Carregando…</p></div><p class="small">Uma brincadeira feita para calibrar o quiz. As respostas serão enviadas para a planilha privada da organizadora depois que você tocar em Enviar.</p></main><script>
const Q=[["Uma amiga marca um jantar para celebrar uma conquista, mas no dia aparece arrasada. Você…",[["Mudo o plano: hoje a gente celebra do jeito que ela aguentar.",[0,0,2,5,0]],["Faço a noite ficar leve sem fingir que nada aconteceu.",[0,5,0,0,2]],["Percebo um detalhe no jeito dela e pergunto sobre isso em particular.",[0,0,2,0,5]],["Tento entender o que deu errado e o que posso fazer de concreto.",[5,0,0,2,0]],["Faço questão de guardar um momento bonito, mesmo que pequeno.",[0,2,5,0,0]]]],["Você descobre que defendeu uma opinião errada por uma semana. Qual é a reação?",[["Conto para o grupo antes que alguém descubra: pelo menos virou história.",[2,5,0,0,0]],["Assumo, mas quero mostrar exatamente onde meu raciocínio mudou.",[5,0,0,2,0]],["Peço desculpas a quem foi afetado, sem fazer a conversa sobre mim.",[0,0,2,5,0]],["Dou risada da minha confiança e deixo uma piada de despedida.",[0,2,0,0,5]],["Reconheço que minha vontade de acreditar pesou na interpretação.",[0,0,5,2,0]]]],["Num fim de semana fora, tudo dá errado: chuva, reserva perdida e ninguém decide. Você…",[["Encontro uma alternativa interessante que ninguém tinha considerado.",[2,0,0,0,5]],["Puxo uma decisão prática e transformo a confusão em roteiro novo.",[5,2,0,0,0]],["Vou atrás de um lugar acolhedor para salvar o clima do grupo.",[0,0,5,0,2]],["Ouço as restrições de cada uma para ninguém ficar frustrada depois.",[2,0,0,5,0]],["Convenço todo mundo a tentar algo completamente fora do plano.",[0,5,2,0,0]]]],["Alguém conta uma história muito boa sobre você, mas exagera bastante. Você…",[["Deixo contar: a versão aumentada está mais engraçada que a original.",[0,5,0,0,2]],["Corrijo uma parte essencial porque muda o sentido de tudo.",[5,0,0,2,0]],["Entro na brincadeira com um comentário que só quem estava lá entende.",[0,2,0,0,5]],["Fico feliz que aquele momento tenha marcado alguém.",[0,0,5,2,0]],["Depois, em particular, explico o que não gostei de ver distorcido.",[2,0,0,5,0]]]],["Uma pessoa de quem você gosta reaparece pedindo uma segunda chance. O que pesa mais?",[["Se houve crescimento real ou só uma nova versão da mesma promessa.",[2,0,0,5,0]],["Se o reencontro ainda desperta alguma coisa que vale ser vivida.",[0,2,5,0,0]],["O que ela fez desde a última vez, não só o discurso de agora.",[5,0,0,0,2]],["Se eu quero mesmo reabrir essa história ou só gosto da possibilidade.",[0,0,2,0,5]],["A coragem de descobrir o que acontece, sem prometer um final.",[0,5,2,0,0]]]],["Uma amiga insiste em pedir conselho, mas nunca segue nenhum. Você…",[["Continuo ouvindo, mas paro de tentar decidir por ela.",[0,0,0,5,2]],["Proponho um experimento: desta vez ela faz algo diferente e conta depois.",[5,2,0,0,0]],["Mando uma reação engraçada e fico disponível quando a poeira baixar.",[0,2,0,0,5]],["Deixo ela contar a história inteira, inclusive o lado contraditório.",[2,5,0,0,0]],["Pergunto o que ela realmente deseja, antes de discutir o que seria racional.",[0,0,5,2,0]]]],["Você foi convidada para um programa em que não conhece quase ninguém. Seu jeito de entrar é…",[["Encontro uma conversa boa com alguém improvável e esqueço o relógio.",[0,0,5,0,2]],["Vou circulando até identificar quem tem as histórias mais interessantes.",[5,2,0,0,0]],["Observo a dinâmica e entro quando encontro uma abertura natural.",[0,0,0,2,5]],["Faço amizade com quem também parece um pouco deslocado.",[0,0,2,5,0]],["Aceito uma proposta aleatória e acabo conhecendo metade da festa.",[2,5,0,0,0]]]],["O grupo precisa escolher entre contar uma verdade desconfortável e preservar a paz. Você…",[["Prefiro uma conversa honesta, mas penso muito em como ela vai chegar.",[0,0,2,5,0]],["Acho pior deixar a situação crescer em silêncio; melhor enfrentar.",[5,2,0,0,0]],["Sei que o timing importa: às vezes uma frase certa vale mais que um discurso.",[2,0,0,0,5]],["Não consigo fingir que está tudo bem e tento abrir o assunto naturalmente.",[2,5,0,0,0]],["Penso no vínculo que pode se perder e procuro uma forma delicada de falar.",[0,0,5,0,2]]]],["Seu grupo ganha uma câmera que grava um único momento para rever daqui a dez anos. Você escolheria…",[["Aquele improviso que saiu completamente do controle e deu certo.",[0,5,0,0,2]],["Uma conversa honesta que mudou alguma coisa entre nós.",[0,0,2,5,0]],["O momento pequeno cujo significado só apareceu depois.",[0,0,5,2,0]],["O minuto em que finalmente descobrimos a verdade de uma história absurda.",[5,2,0,0,0]],["Uma cena cotidiana que hoje parece banal, mas vai virar saudade.",[0,0,2,0,5]]]],["Você percebe que anda repetindo um comportamento que critica nas amigas. O que faz?",[["Admito a contradição — talvez até antes de alguém apontar.",[2,0,0,0,5]],["Chamo minhas amigas para me ajudarem a enxergar o que não estou vendo.",[5,0,0,2,0]],["Tento ser mais gentil comigo antes de mudar o que for preciso.",[0,0,5,2,0]],["Questiono se eu estava julgando situações diferentes como se fossem iguais.",[0,0,0,5,2]],["Rio do roteiro repetido, mas tento escrever um final diferente.",[0,5,2,0,0]]]]];
const ENDPOINT='https://script.google.com/macros/s/AKfycbxvtqReB9Y-6q9DXscDX8fP_C5lUISHPyj46pZhevalnDsrsMWgPt0S2m0OWAbsgDPD/exec';
const friends=['Camila','Isabela','Helen','Renata','Sofia'];
const peer=[
'Quem costuma perceber que uma versão da história não bate com outra?',
'Quem transforma um pequeno acontecimento numa história ótima para contar?',
'Quem surpreende com uma sugestão cultural ou programa inesperado?',
'Quem tem mais chance de defender uma amiga mesmo discordando da decisão dela?',
'Quem mais consegue mudar o clima de uma noite que começou ruim?',
'Quem, na prática, frequentemente toma iniciativa para reunir o grupo?',
'Quem mais provavelmente daria uma segunda chance apesar dos alertas?',
'Quem costuma ser mais direta quando algo incomoda de verdade?',
'Quem lembra de detalhes emocionais ou pequenas memórias anos depois?',
'Quem mais muda de opinião depois de ouvir novas informações?'
];
let name='',phase=0,idx=0,first=Array(10).fill(null),second=Array(10).fill(null),others=Array(10).fill(null);
const app=document.getElementById('app');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(phase===0){app.innerHTML=`<div class="eyebrow">ESPECIAL PARA AS CINCO</div><h1>Quem brinca muito vira… quem? 💗</h1><p class="sub">Antes de descobrir quem é quem, queremos entender como cada uma se enxerga — e como as outras a enxergam.</p><p class="note"><b>São 2 etapas:</b> 10 perguntas sobre você (duas opções por pergunta) e 10 comparações sobre suas amigas (uma pessoa por pergunta). Sem nota certa ou errada.</p><label for="who"><b>Quem está respondendo?</b></label><select id="who" class="select"><option value="">Selecione seu nome</option>${friends.map(n=>`<option value="${n}" ${name===n?'selected':''}>${n}</option>`).join('')}</select><p class="small">Não informe senhas ou dados pessoais. Ao finalizar, suas respostas serão enviadas à planilha privada da organizadora. Responda apenas se estiver de acordo.</p><div class="row"><span></span><button class="btn" id="start">Começar →</button></div>`;document.getElementById('start').onclick=()=>{const n=document.getElementById('who').value;if(!n){alert('Selecione seu nome.');return}name=n;phase=1;idx=0;render()};return}
if(phase===3){
const payload={versao:'calibracao-v2',participante:name,autorrelato:Q.map((q,i)=>({numero:i+1,pergunta:q[0],mais:{indice:first[i],resposta:q[1][first[i]][0]},segunda:{indice:second[i],resposta:q[1][second[i]][0]}})),percepcao_amigas:peer.map((p,i)=>({numero:i+1,pergunta:p,escolhida:others[i]}))};
app.innerHTML=`<div class="eyebrow">QUASE LÁ ✨</div><h1>Pronto, ${esc(name)}! 💌</h1><p class="sub">Suas 20 respostas estão completas. Toque em <b>Enviar respostas</b> para salvá-las automaticamente na planilha privada da organizadora.</p><p class="note" id="status">Ao enviar, você concorda em compartilhar suas escolhas com a organizadora para montar o quiz do grupo.</p><div class="row"><button class="btn secondary" id="back">← Revisar</button><button class="btn" id="send">Enviar respostas 💗</button></div>`;
document.getElementById('back').onclick=()=>{phase=2;idx=9;render()};
document.getElementById('send').onclick=async()=>{
const btn=document.getElementById('send'),status=document.getElementById('status');
btn.disabled=true;btn.textContent='Enviando…';status.textContent='Salvando respostas na planilha…';
// ID fixo durante tentativas: não duplica a mesma resposta quando a usuária clica de novo.
if(!window.quizSubmissionId) window.quizSubmissionId = 'q'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
try {
const result=await sendToSheet({id:window.quizSubmissionId,participante:name,first,second,peers:others});
if(!result || result.saved!==true) throw new Error((result&&result.error)||'Não houve confirmação de gravação.');
app.innerHTML=`<div class="eyebrow">TUDO CERTO ✨</div><h1>Obrigada, ${esc(name)}! 💖</h1><p class="sub">Suas respostas foram <b>salvas na planilha</b>. Você terminou! Não precisa enviar nada para ninguém.</p>`;
}catch(err){status.textContent='Não foi possível salvar: '+String(err.message||err)+'. Tente novamente. Se persistir, avise a organizadora.';btn.disabled=false;btn.textContent='Tentar enviar novamente';}
};return;}
function sendToSheet(data){return new Promise((resolve,reject)=>{
const callback='quizAck_'+Math.random().toString(36).slice(2);
const script=document.createElement('script');let finished=false;
const timeout=setTimeout(()=>done(null,new Error('Sem resposta do Apps Script. Verifique a implantação e o acesso público.')),15000);
function done(response,error){if(finished)return;finished=true;clearTimeout(timeout);script.remove();delete window[callback];if(error)reject(error);else resolve(response)}
window[callback]=response=>done(response,null);
script.onerror=()=>done(null,new Error('Falha ao acessar o Apps Script. Confira se publicou uma NOVA VERSÃO da implantação.'));
const p=new URLSearchParams({action:'save',callback,id:data.id,participante:data.participante,first:data.first.join(','),second:data.second.join(','),peers:data.peers.map(n=>friends.indexOf(n)).join(','),t:String(Date.now())});
script.src=ENDPOINT+'?'+p.toString();document.head.appendChild(script);
})}
let self=phase===1,question=self?Q[idx][0]:peer[idx],items=self?Q[idx][1].map(x=>x[0]):friends.filter(n=>n!==name);let chosen=self?first[idx]:items.indexOf(others[idx]);app.innerHTML=`<div class="eyebrow">ETAPA ${phase} DE 2 · ${self?'COMO VOCÊ SE VÊ':'COMO VOCÊ VÊ SUAS AMIGAS'}</div><div class="bar"><div style="width:${((phase-1)*10+idx)/20*100}%"></div></div><p class="hint">Pergunta ${idx+1} de 10 ${self?'· escolha a que MAIS combina e depois a segunda':'· escolha UMA amiga, sem incluir você'}</p><h2>${esc(question)}</h2><div id="choices">${items.map((t,i)=>`<button type="button" class="option ${chosen===i?'selected':''}" data-opt="${i}"><span class="letter">${self?'ABCDE'[i]:'✦'}</span>${esc(t)}</button>`).join('')}</div>${self?`<p class="hint"><b>Segunda opção mais parecida com você:</b></p><div id="runner">${items.map((t,i)=>`<button type="button" class="option ${second[idx]===i?'selected':''}" data-second="${i}" ${first[idx]===i?'disabled':''}><span class="letter">${'ABCDE'[i]}</span>${esc(t)}</button>`).join('')}</div>`:''}<div class="row"><button type="button" class="btn secondary" id="back" ${idx===0&&phase===1?'disabled':''}>← Voltar</button><button type="button" class="btn" id="next" ${self?(first[idx]===null||second[idx]===null):others[idx]===null?'disabled':''}>${phase===2&&idx===9?'Concluir 💌':'Próxima →'}</button></div>`;
document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.opt);if(self){first[idx]=i;if(second[idx]===i)second[idx]=null}else others[idx]=items[i];render()});document.querySelectorAll('[data-second]').forEach(b=>b.onclick=()=>{second[idx]=Number(b.dataset.second);render()});document.getElementById('back').onclick=()=>{if(idx>0)idx--;else if(phase===2){phase=1;idx=9}render()};document.getElementById('next').onclick=()=>{if(self&&(first[idx]===null||second[idx]===null))return;if(!self&&others[idx]===null)return;if(idx<9)idx++;else{phase++;idx=0}render();window.scrollTo(0,0)};}
render();
</script></body></html>
